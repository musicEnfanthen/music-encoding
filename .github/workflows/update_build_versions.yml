name: Update Build Versions

on:
  pull_request:
    paths:
      - 'build.properties'

env:
  REPO_OWNER: musicEnfanthen
  DOCKER_REPO: docker-mei
  DOCKER_DIR: docker

jobs:
  update-build-commandline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout main repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.head_ref }}

    - name: Update versions in BUILD_COMMANDLINE.md
      run: docker run --rm -v $(pwd):/opt/docker-mei/music-encoding ghcr.io/music-encoding/docker-mei:latest ant update-versions-markdown -noinput -buildfile music-encoding/build.xml 

    - name: Commit and push changes for BUILD_COMMANDLINE.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add BUILD_COMMANDLINE.md
        if ! git diff-index --quiet HEAD; then
          git commit -m 'docs: update versions in BUILD_COMMANDLINE.md'
          git push origin HEAD:${{ github.head_ref }}
        else
          echo "No changes to commit"
        fi
  
  
  update-dockerfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout main repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.head_ref }}


    - name: Checkout docker-mei repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: ${{ env.REPO_OWNER }}/${{ env.DOCKER_REPO }}
        # Secret for accessing <owner>/<DOCKER_REPO>;
        # cf. explanation in https://github.com/rism-ch/verovio/pull/1751
        token: ${{ secrets.DOCKER_MEI_PAT }}
        # ref (branch, tag or SHA) to check out
        ref: main
        # Path to a directory in the repository to check out
        path: ${{ env.DOCKER_DIR }}

    - name: Copy Dockerfile to main repository
      run: |
        touch Dockerfile
        cp ${{ env.DOCKER_DIR }}/Dockerfile Dockerfile

    - name: Update build versions in Dockerfile
      run: docker run --rm -v $(pwd):/opt/docker-mei/music-encoding ghcr.io/music-encoding/docker-mei:latest ant update-versions-docker -noinput -buildfile music-encoding/build.xml 

    - name: Copy Dockerfile back to docker-mei repository
      run: |
        cp Dockerfile ${{ env.DOCKER_DIR }}/Dockerfile

    - name: Verify changes in Dockerfile
      working-directory: ${{ env.DOCKER_DIR }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git status

    - name: Create pull request in docker-mei repository
      id: cpr
      uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7.0.6
      with:
        token: ${{ secrets.DOCKER_MEI_PAT }}
        path: ${{ env.DOCKER_DIR }}
        commit-message: 'build: update versions in Dockerfile'
        branch: feature/update-build-versions
        title: 'build: update versions in Dockerfile'
        body: |
          This PR updates the versions in the Dockerfile.
          
          Automatically triggered from GH actions workflow in ${{ env.REPO_OWNER }}/music-encoding#${{ github.event.pull_request.number }}.
        base: main

